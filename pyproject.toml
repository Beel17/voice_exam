[project]
name = "voice-exam-agent"
version = "0.1.0"
description = "Offline, CPU-only voice service for blind candidates taking computer-based exams."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=2.0,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sherpa-onnx>=1.13.8,<2",
    "sherpa-onnx-core==1.13.8",
    "uvicorn>=0.32,<1",
    "websockets>=13,<16",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "spec", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "spec", "tools"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests", "spec/conformance"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.mypy.overrides]]
# Native speech library without type information.
module = ["sherpa_onnx", "sherpa_onnx.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Look-alike characters (×, −, α) are exactly what these files exist to handle.
"src/voice_agent/speech/speakable.py" = ["RUF001"]
"tests/unit/test_speakable.py" = ["RUF001"]
"tests/integration/test_synthesis.py" = ["RUF001"]
# It writes an Inno Setup script, in which every entry is one line however long.
"tools/make_installer.py" = ["E501"]
