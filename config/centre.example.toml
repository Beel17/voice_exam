# Copy to config/centre.toml at set-up. Every value can be overridden by an environment
# variable, e.g. VOICE_AGENT_MODE=server or VOICE_AGENT_LIMITS__MAX_UTTERANCE_CHARS=200.

# "pc": this machine serves its own candidate only (binds to 127.0.0.1).
# "server": this machine serves every voice candidate in the centre (binds to the LAN).
mode = "pc"

# host = "127.0.0.1"   # leave unset to use the mode's default
port = 8765

data_dir = "data"
models_dir = "models"

# SHA-256 hex digests of the device tokens issued at set-up. Never put tokens here.
device_token_sha256 = []

[limits]
max_utterance_chars = 300

[llm]
# Set enabled = false to run on rules only (no language model at all).
enabled = true
server_binary = "models/llama-server/llama-server"
model_file = "models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
# threads = 4   # leave unset: most of the cores in PC mode, 2 per slot in server mode
slots = 1
timeout_s = 3.0
max_calls_per_minute = 20

[speech]
# Set enabled = false for text and keys only. If the speech models are missing or do not
# match models/manifest.json, the service starts in keyboard mode and says why in its log.
enabled = true
# One recogniser per worker, one core each: the pool size is speech's share of the CPU.
recognition_workers = 1

[adapter]
# "local": the centre's exam store (<data_dir>/exams.db). Load papers with
# python -m voice_agent.examstore (or download them with python -m voice_agent.sync pull),
# then open a paper for candidates to sign in. "fake": built-in practice exams only.
kind = "local"

[sync]
# The cloud this centre downloads papers from and uploads results to. The centre's token
# goes in <data_dir>/sync-token.txt, never in this file.
# url = "https://exams.example.org"
# centre_id = "CENTRE-001"
